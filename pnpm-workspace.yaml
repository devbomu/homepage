packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: set this to true or false
  workerd: set this to true or false

# pnpm 10+ 는 기본적으로 의존성의 postinstall 스크립트를 실행하지 않는다.
# wrangler 의 로컬 런타임(workerd)과 번들러(esbuild)는 바이너리를 받아와야 하므로
# 이것들만 명시적으로 허용한다.
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
  - '@tailwindcss/oxide'
