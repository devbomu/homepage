packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 은 기본적으로 의존성의 postinstall 스크립트를 실행하지 않는다.
# 아래 패키지들은 설치 시 네이티브 바이너리를 받아와야 하므로 명시적으로 허용한다.
#   workerd          — wrangler 의 로컬 Workers 런타임
#   esbuild          — wrangler / vite 번들러
#   @parcel/watcher  — astro 의 파일 감시
# 여기 없는 패키지의 빌드가 필요해지면 설치가 실패하면서 이름을 알려준다.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true

# 전이 의존성 버전 고정.
#
# drizzle-kit 이 오래된 esbuild 를 끌고 온다 (GHSA-67mh-4wv8-2f99).
# esbuild 개발 서버를 아무 웹사이트나 찌를 수 있는 문제인데, 우리는 그 서버를
# 띄우지 않으므로 실제 노출은 없다. 그래도 경보를 방치할 이유가 없어 올려둔다.
overrides:
  esbuild: '>=0.25.0'
