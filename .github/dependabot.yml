# 의존성 업데이트.
#
# 보안 패치는 GitHub 설정의 "Dependabot security updates" 가 즉시 올린다.
# 이 파일은 그 외의 일반 버전 업데이트를 다루는데, 설정 없이 켜면
# 매주 PR 이 열 개씩 열려서 결국 아무도 안 보게 된다.
# 그래서 주 1회, 생태계별로 묶어서 한 개의 PR 로 받는다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      # 메이저가 아닌 것은 전부 하나로 묶는다. 대개 그냥 머지하면 된다.
      minor-and-patch:
        update-types: [minor, patch]
      # 메이저는 따로 본다. 깨질 수 있어서 각각 확인이 필요하다.
      major:
        update-types: [major]
    ignore:
      # TypeScript 7 은 네이티브(Go) 포트라 프로그래매틱 API(ts.sys, ts.findConfigFile)를
      # 노출하지 않는다. @astrojs/language-server 가 그 API 에 의존해서
      # `astro check` 가 아예 기동하지 못한다 — 설정으로 넘을 수 있는 벽이 아니다.
      # Astro 쪽이 대응하면 이 항목을 지우고 다시 시도한다.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
