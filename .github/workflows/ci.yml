name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 포맷 확인
        run: pnpm format:check

      - name: 타입 확인
        run: pnpm typecheck

      - name: 유닛 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

  # 마이그레이션이 실제로 적용되는지, 그리고 schema.ts 와 어긋나지 않았는지 본다.
  # drizzle-kit 은 트리거와 FTS5 가상 테이블을 모르므로 생성된 SQL 만으로는 알 수 없다.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 빈 DB 에 마이그레이션 적용
        run: pnpm db:migrate:local

      - name: 시드 데이터 적용
        run: pnpm db:seed:local

      - name: schema.ts 와 마이그레이션이 어긋나지 않았는지
        run: |
          pnpm db:generate
          if ! git diff --quiet packages/db/migrations; then
            echo "::error::schema.ts 를 고친 뒤 'pnpm db:generate' 를 실행하지 않았습니다."
            git diff --stat packages/db/migrations
            exit 1
          fi
